<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css" />
  <title>Clownernews - Tech Portal</title>
</head>
<body>

  <div id="head">
    <div id="top">
      <h1 id="header">clownernews</h1>
      <h3 id="com">Stay updated every second</h3>
    </div>
    <div id="top2">
      <div id="com2">Explore, learn and comment on things you like daily</div>
    </div>
  </div>
  <div id="line"></div>

  <nav id="menu">
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="about.html">About us</a></li>
    </ul>
  </nav>

  <main id="main">
    <div id="info">
      <div id="live-indicator">
        <span class="pulse-dot"></span>
        <span class="live-text">Live: Updates every 5s</span>
      </div>
    </div>

    <div id="filter-buttons">
      <button class="filter-btn active" data-type="story">Stories</button>
      <button class="filter-btn" data-type="job">Jobs</button>
      <button class="filter-btn" data-type="poll">Polls</button>
    </div>

    <div class="board-wrapper">
      <div id="posts-container"></div>

      <aside class="live-board" aria-labelledby="live-board-title">
        <h2 class="live-board-title" id="live-board-title">
          Real-Time Feed
        </h2>
        <section
          id="live-notification-area"
          aria-label="Live Hacker News updates"
          aria-live="polite"
          aria-relevant="additions"
        ></section>
      </aside>
    </div>
  </main>

  <script src="js/script.js"></script>
  <script src="js/Render.js"></script>
  <script src="js/RenderCom.js"></script>
  <script src="js/Handle scroll.js"></script>
  <script src="js/live-updates.js"></script>
</body>
</html>
