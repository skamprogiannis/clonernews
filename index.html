<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css" />
  <title>Clownernews - Tech Portal</title>
</head>
<body>

  <div id="head">
    <div id="top">
      <h1 id="header">clownernews</h1>
      <h3 id="com">Stay updated every second</h3>
    </div>
    <div id="top2">
      <div id="com2">Explore, learn and comment on things you like daily</div>
    </div>
  </div>
  <div id="line"></div>

  <nav id="menu">
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">About us</a></li>
    </ul>
  </nav>

  <main id="main">
    
    <div id="info">
      <input type="text" id="inp" placeholder="Search..." />
      <div id="live-indicator">
        <span class="pulse-dot"></span>
        <span class="live-text">Live: Updates every 5s</span>
      </div>
    </div>

    <div id="filter-buttons">
      <button class="filter-btn active" data-type="story">Stories</button>
      <button class="filter-btn" data-type="job">Jobs</button>
      <button class="filter-btn" data-type="poll">Polls</button>
    </div>

    <div class="board-wrapper">
      
      <!-- Αριστερή Στήλη: Το Κύριο Feed -->
      <div id="posts-container"></div>
      
      <div id="live-notification-area">
        <div class="live-board-title">⚡ Real-Time Feed</div>
      </div>

    </div>

  </main>

  <script src="js/script.js"></script>
</body>
</html>
